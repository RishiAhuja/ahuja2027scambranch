# Released profile: corpus example sentences (reference_utterances, unnatural_examples and
# per-pattern examples) are removed because the source licences allow statistics only.
# Counts, bands and word forms are kept. scripts/calibration/ rebuilds the full profile.
pair: hi_en
script: roman
version: 0.1-auto
status_note: automatically derived from human-written corpora; not yet reviewed by
  a fluent speaker
known_gaps:
- Calibration sources are social media, QA, or restaurant-bot translations — not authentic
  Indian fraud or care calls.
- LinCE tweet text is not redistributable; strict service-candidate audit precision
  is 60%.
- No open human Roman Hinglish phone-call / customer-care corpus.
