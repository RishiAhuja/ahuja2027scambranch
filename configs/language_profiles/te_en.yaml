  status: supported_by_data
  evidence: mixing_bands origin=gold; also service_register_bands for generation
- rule_id: L05
  status: supported_by_data
  evidence: romanization_variants from romanization_clusters_clean.tsv plus Dakshina
    alternations
- rule_id: L06
  status: supported_by_data
  evidence: address_forms with formal/neutral/informal counts from the pair corpora
- rule_id: L07
  status: policy
  evidence: named entities, payment acronyms, or a lone greeting do not establish
    bilingual substance
- rule_id: L08
  status: policy
  evidence: semantic fidelity is an experimental invariant, not a corpus statistic
- rule_id: L09
  status: policy
  evidence: mixing, spelling, and register must be distributed across labels (design
    requirement)
