    speaker review
- rule_id: L11
  status: policy
  evidence: do not enforce one matrix language globally; mixing_bands include monolingual
    turns
- rule_id: L12
  status: policy
  evidence: exclude English glosses, parenthetical translations, and stage directions
    from detector input
